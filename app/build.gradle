plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marketmood.widget'
    compileSdk 35

    defaultConfig {
        applicationId 'com.marketmood.widget'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '1.9.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
