<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>공포 & 탐욕 지수</title>
<style>
:root{--purple:#6f3fc4;--green:#82bf45;--green2:#339344;--red:#db3e3e;--blue:#2d69ae;--orange:#ff9812;--yellow:#ffc83d;--text:#17181b;--muted:#999ba2;--bg:#f6f6f7;--line:#dddde0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif}button,input{font:inherit}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d9d9dc}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.title{font-size:29px;font-weight:400;letter-spacing:-1.6px}.info{border:0;background:transparent;font-size:29px;line-height:1;color:#3c3d42;padding:4px}
.tabs{height:54px;display:grid;grid-template-columns:repeat(3,1fr)}.tab{position:relative;border:0;background:#fff;color:#a1a1a5;font-size:18px;font-weight:800}.tab.active{color:#171719}.tab.active:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:42px;height:4px;border-radius:4px 4px 0 0;background:var(--purple)}
main{max-width:720px;margin:auto;padding:18px 16px 44px}.panel{display:none}.panel.active{display:block}.card{background:#fff;border-radius:28px;box-shadow:0 7px 23px rgba(0,0,0,.055);padding:22px;margin-bottom:20px}
.gauge-card{text-align:center;padding:22px 22px 28px}.gauge-wrap{width:min(300px,91%);margin:0 auto}.gauge{display:block;width:100%;height:auto;overflow:visible}.score{font-size:58px;line-height:1;font-weight:700;letter-spacing:-2px;margin-top:-2px}.sentiment{font-size:20px;font-weight:900;color:var(--green);margin-top:14px}.daily{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:13px;font-size:15px;font-weight:800}.daily .date{color:#a5a6ab;font-weight:700}.up{color:var(--red)}.down{color:var(--blue)}.flat{color:#777}.alert{display:inline-block;margin-top:14px;padding:8px 11px;border-radius:12px;background:#fff2e8;color:#ef771f;font-size:13px;font-weight:900}.alert:empty{display:none}
.section-title{margin:0 0 12px;font-size:24px;font-weight:900;letter-spacing:-1px}.history-row{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);font-size:17px}.history-row:last-child{border-bottom:0}.history-right{display:flex;align-items:center;gap:11px}.history-right b{font-size:19px}.tag{font-size:13px;font-weight:900;padding:7px 10px;border-radius:12px}.tag.greed{background:#eef7e6;color:#78aa42}.tag.neutral{background:#fff7dc;color:#d1a117}.tag.fear{background:#fff0dc;color:#dd971a}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.chart-title{font-size:21px;font-weight:900}.pill{font-size:12px;font-weight:900;padding:6px 9px;border-radius:999px;background:#edf6e8;color:#579731}canvas.week{width:100%;height:124px;display:block}
.date-box{display:flex;gap:8px}.date-box input{flex:1;min-width:0;border:1px solid #dddde2;border-radius:12px;padding:11px 10px;background:#fff}.primary{border:0;border-radius:12px;background:var(--purple);color:#fff;font-weight:900;padding:0 16px}.date-help{font-size:12px;color:#8e8f95;line-height:1.55;margin-top:11px}.result-box{margin-top:12px;border:1px solid #ececf0;border-radius:15px;padding:13px}.result-box b{font-size:24px}.result-change{margin-top:5px;font-weight:900}
.indices-note{font-size:12px;color:#898a90;line-height:1.5;margin:0 3px 13px}.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.index-card{background:#fff;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.05);padding:17px}.index-name{font-size:18px;font-weight:900}.index-date{float:right;color:#999;font-size:11px;font-weight:700}.index-value{font-size:29px;font-weight:900;margin-top:22px;letter-spacing:-1px}.index-change{font-size:14px;font-weight:900;margin-top:7px}.index-alert{font-size:12px;color:#ef771f;font-weight:900;margin-top:8px}.wide{grid-column:1/-1}.wide .index-value{font-size:36px}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.mini{background:#fff;border-radius:24px;box-shadow:0 6px 20px rgba(0,0,0,.05);padding:17px;min-height:142px}.mini-title{font-size:17px;font-weight:900}.mini-sub{float:right;color:#999;font-size:11px;font-weight:800}.mini-big{font-size:27px;font-weight:900;margin-top:27px}.mini-note{font-size:12px;color:#898a90;line-height:1.4;margin-top:7px}
.loading{display:none;position:fixed;right:15px;bottom:18px;background:#1d1e22;color:#fff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;box-shadow:0 7px 20px rgba(0,0,0,.22)}.loading.show{display:block}
@media(max-width:370px){.title{font-size:26px}.top{padding:0 17px}.tab{font-size:17px}.score{font-size:52px}.gauge-wrap{width:min(282px,94%)}.card{border-radius:24px}.index-value{font-size:26px}}
</style>
</head>
<body>
<header>
  <div class="top"><div id="pageTitle" class="title">공포 &amp; 탐욕 지수</div><button id="infoBtn" class="info" onclick="showInfo()">ⓘ</button></div>
  <div class="tabs"><button class="tab active" data-tab="nasdaq">나스닥</button><button class="tab" data-tab="kospi">코스피</button><button class="tab" data-tab="indices">지표</button></div>
</header>
<main><section id="nasdaq" class="panel active"></section><section id="kospi" class="panel"></section><section id="indices" class="panel"></section></main>
<div id="loading" class="loading">데이터 갱신 중…</div>
<script>
const fallback={
 nasdaq:{name:'나스닥',date:'2026-08-07',value:24839.37,change:396.42,changePct:1.62,score:63.7,prevDayScore:59.7,weekAgoScore:45.2,monthAgoScore:39.8,yearAgoScore:54.7,sentiment:'탐욕',alert:'',weekly:[{date:'6/5',value:22500},{date:'6/12',value:22920},{date:'6/19',value:23140},{date:'6/26',value:22800},{date:'7/3',value:23360},{date:'7/10',value:23610},{date:'7/17',value:23980},{date:'7/24',value:24400},{date:'7/31',value:24230},{date:'8/7',value:24839}]},
 kospi:{name:'코스피',date:'2026-08-07',value:6258.77,change:-37.61,changePct:-.60,score:68.0,prevDayScore:64.0,weekAgoScore:49.0,monthAgoScore:33.0,yearAgoScore:55.0,sentiment:'탐욕',alert:'',weekly:[{date:'6/5',value:5650},{date:'6/12',value:5780},{date:'6/19',value:5890},{date:'6/26',value:5820},{date:'7/3',value:5980},{date:'7/10',value:6110},{date:'7/17',value:6170},{date:'7/24',value:6220},{date:'7/31',value:6300},{date:'8/7',value:6258}]},
 kosdaq:{name:'코스닥',date:'2026-08-07',value:798.81,change:-2.86,changePct:-.36,score:54,sentiment:'중립',alert:'',weekly:[]}
};
let data=JSON.parse(JSON.stringify(fallback));
const cls=v=>v>0?'up':v<0?'down':'flat';
const pct=v=>(v>0?'▲ +':v<0?'▼ ':'')+Math.abs(Number(v||0)).toFixed(2)+'%';
const fmt=v=>Number(v||0).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});
function label(v){return v<20?'극도의 공포':v<40?'공포':v<60?'중립':v<80?'탐욕':'극도의 탐욕'}
function tag(v){let s=label(v);return s.includes('공포')?'fear':s==='중립'?'neutral':'greed'}
function gaugeSvg(score){
  const a=-180+Math.max(0,Math.min(100,score))*1.8,r=91,cx=160,cy=118,x=cx+Math.cos(a*Math.PI/180)*r,y=cy+Math.sin(a*Math.PI/180)*r;
  return `<svg class="gauge" viewBox="0 -8 320 166">
  <path d="M52 118 A108 108 0 0 1 268 118" fill="none" stroke="#ececee" stroke-width="40"/>
  <path d="M52 118 A108 108 0 0 1 83 44" fill="none" stroke="#e12e2d" stroke-width="38"/>
  <path d="M83 44 A108 108 0 0 1 132 14" fill="none" stroke="#ff9811" stroke-width="38"/>
  <path d="M132 14 A108 108 0 0 1 188 14" fill="none" stroke="#ffc83d" stroke-width="38"/>
  <path d="M188 14 A108 108 0 0 1 237 44" fill="none" stroke="#8bc54a" stroke-width="38"/>
  <path d="M237 44 A108 108 0 0 1 268 118" fill="none" stroke="#399445" stroke-width="38"/>
  <line x1="160" y1="118" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#17181b" stroke-width="9" stroke-linecap="round"/><circle cx="160" cy="118" r="16" fill="#17181b"/>
  <g font-size="13" font-weight="700" fill="#202124"><text x="34" y="124">0</text><text x="69" y="49">20</text><text x="126" y="12">40</text><text x="184" y="12">60</text><text x="244" y="49">80</text></g></svg>`;
}
function history(m){return [['지난 거래일',m.prevDayScore],['일주일 전',m.weekAgoScore],['한 달 전',m.monthAgoScore],['1년 전',m.yearAgoScore]].map(([n,v])=>`<div class="history-row"><span>${n}</span><span class="history-right"><b>${Number(v||0).toFixed(1)}</b><span class="tag ${tag(v)}">${label(v)}</span></span></div>`).join('')}
function marketPanel(key){let m=data[key];return `<div class="card gauge-card"><div class="gauge-wrap">${gaugeSvg(m.score)}</div><div class="score">${Number(m.score).toFixed(1)}</div><div class="sentiment">${m.sentiment}</div><div class="daily ${cls(m.changePct)}"><span class="date">${m.date}</span><span>${pct(m.changePct)}</span></div>${m.alert?`<div class="alert">${m.alert}</div>`:''}</div>
<div class="card"><h2 class="section-title">이전 지수</h2>${history(m)}</div>
<div class="card"><div class="chart-head"><span class="chart-title">주봉 추이</span><span class="pill">최근 10주</span></div><canvas id="chart-${key}" class="week" width="640" height="220"></canvas></div>
<div class="card"><h2 class="section-title">날짜별 등락률</h2><div class="date-box"><input id="date-${key}" type="date" value="${m.date}"><button class="primary" onclick="lookupDate('${key}')">조회</button></div><div id="date-result-${key}" class="date-help">선택한 거래일이 전 거래일보다 몇 % 올랐거나 내렸는지 확인합니다.</div></div>`}
function indicesPanel(){let k=data.kospi,q=data.kosdaq,n=data.nasdaq;return `<div class="indices-note">등락률은 각 시장의 최근 거래일 종가 기준입니다. 사이드카·서킷브레이커는 실제 발동이 확인된 경우에만 코스피 아래에 표시합니다.</div><div class="ind-grid">
<div class="index-card"><span class="index-name">KOSPI</span><span class="index-date">${k.date}</span><div class="index-value">${fmt(k.value)}</div><div class="index-change ${cls(k.changePct)}">${pct(k.changePct)}</div>${k.alert?`<div class="index-alert">${k.alert}</div>`:''}</div>
<div class="index-card"><span class="index-name">KOSDAQ</span><span class="index-date">${q.date}</span><div class="index-value">${fmt(q.value)}</div><div class="index-change ${cls(q.changePct)}">${pct(q.changePct)}</div></div>
<div class="index-card wide"><span class="index-name">NASDAQ</span><span class="index-date">${n.date}</span><div class="index-value">${fmt(n.value)}</div><div class="index-change ${cls(n.changePct)}">${pct(n.changePct)}</div></div></div>
<div class="subgrid"><div class="mini"><span class="mini-title">빚투</span><span class="mini-sub">신용융자잔고</span><div class="mini-big">시장 보조지표</div><div class="mini-note">추후 KRX/금융투자협회 원자료 연동용 자리</div></div><div class="mini"><span class="mini-title">예탁금</span><span class="mini-sub">투자자예탁금</span><div class="mini-big">시장 대기자금</div><div class="mini-note">원본 앱처럼 지표 카드로 확장 가능</div></div></div>`}
function render(){document.querySelector('#nasdaq').innerHTML=marketPanel('nasdaq');document.querySelector('#kospi').innerHTML=marketPanel('kospi');document.querySelector('#indices').innerHTML=indicesPanel();requestAnimationFrame(()=>{drawWeek('nasdaq');drawWeek('kospi')})}
function drawWeek(key){const cv=document.getElementById('chart-'+key);if(!cv)return;let pts=(data[key].weekly||[]);let ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);if(pts.length<2)return;let vals=pts.map(x=>Number(x.value)),mi=Math.min(...vals),ma=Math.max(...vals);if(ma===mi)ma=mi+1;let L=20,R=cv.width-20,T=20,B=cv.height-35;ctx.strokeStyle='#ececef';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,B);ctx.lineTo(R,B);ctx.stroke();ctx.strokeStyle='#44994b';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>{let x=L+(R-L)*i/(pts.length-1),y=B-(Number(p.value)-mi)/(ma-mi)*(B-T);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#44994b';let last=pts[pts.length-1],y=B-(Number(last.value)-mi)/(ma-mi)*(B-T);ctx.beginPath();ctx.arc(R,y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#989aa0';ctx.font='20px sans-serif';ctx.textAlign='left';ctx.fillText(pts[0].date||'',L,B+28);ctx.textAlign='right';ctx.fillText(last.date||'',R,B+28)}
function lookupDate(key){let d=document.getElementById('date-'+key).value,target=document.getElementById('date-result-'+key);if(!d)return;target.textContent='조회 중…';if(window.MarketNative&&MarketNative.requestDate)MarketNative.requestDate(d);else target.textContent='앱에서 조회할 수 있습니다.';window.pendingKey=key}
window.onDateData=function(raw){try{let o=JSON.parse(raw),key=window.pendingKey||'nasdaq',r=o[key];let el=document.getElementById('date-result-'+key);if(!o.ok||!r){el.textContent=o.error||'조회 실패';return}el.innerHTML=`<div class="result-box"><div>${r.tradingDate}</div><b>${fmt(r.value)}</b><div class="result-change ${cls(r.changePct)}">${pct(r.changePct)}</div></div>`}catch(e){}}
window.onMarketData=function(raw){try{let o=JSON.parse(raw);['kospi','kosdaq','nasdaq'].forEach(k=>{if(o[k])data[k]=typeof o[k]==='string'?JSON.parse(o[k]):o[k]});render();document.getElementById('loading').classList.remove('show')}catch(e){}}
function refresh(){document.getElementById('loading').classList.add('show');if(window.MarketNative&&MarketNative.refresh)MarketNative.refresh()}
function showInfo(){alert('공포·탐욕 지수는 시장 가격 데이터를 이용한 참고용 자체 지표입니다.\n\n위젯은 코스피 탐욕 / 나스닥 탐욕 / 코스피 등락 / 나스닥 등락을 각각 1×1, 2×1로 제공합니다.\n\n사이드카·서킷브레이커는 발동이 확인된 때에만 표시됩니다.');}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');document.getElementById('pageTitle').textContent=b.dataset.tab==='indices'?'시장 지표':'공포 & 탐욕 지수';document.getElementById('infoBtn').style.display=b.dataset.tab==='indices'?'none':'block';if(b.dataset.tab==='indices')refresh()});
render();if(window.MarketNative&&MarketNative.requestDashboard)MarketNative.requestDashboard();
</script>
</body>
</html>
