name: Debug Toss Ticker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/debug-toss.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect API client
        shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          BASE='https://www.tossinvest.com'
          for src in \
            '/assets/v2/_next/static/chunks/8980-7df6f46d247f714f.js' \
            '/assets/v2/_next/static/chunks/6061-1ec6b81752d0bca5.js' \
            '/assets/v2/_next/static/chunks/pages/index-7472de401bd91453.js' \
            '/assets/v2/_next/static/chunks/pages/_app-fcf5c4d3cea24fa2.js' \
            '/assets/v2/_next/static/chunks/main-b515d965dd2e55d7.js'; do
            echo "===== $src ====="
            curl -fsSL --compressed --max-time 12 -A "$UA" "$BASE$src" -o chunk.js || continue
            python3 - <<'PY'
from pathlib import Path
s=Path('chunk.js').read_text(errors='ignore')
needles=['/api/v1/index-prices/','/api/v4/dashboard/wts/overview/indicator','/api/v2/index-infos/','baseURL','api.toss','wts-api','api-invest','invest-api','API_URL','apiUrl']
for n in needles:
    print('\n---',n,'---')
    start=0; count=0
    while True:
        i=s.find(n,start)
        if i<0: break
        print(s[max(0,i-1200):min(len(s),i+2200)])
        start=i+len(n); count+=1
        if count>=5: break
PY
          done
