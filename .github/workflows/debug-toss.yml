name: Debug Toss Ticker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/debug-toss.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Toss pages
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          for u in \
            'https://www.tossinvest.com/' \
            'https://www.tossinvest.com/?contentType=tics' \
            'https://www.tossinvest.com/?contentParams=%7B%22id%22%3A803%7D&contentType=tics' \
            'https://www.tossinvest.com/stocks/US20210301016'; do
            echo "===== $u ====="
            curl -fsSL --compressed --max-time 25 -A "$UA" -H 'Accept-Language: ko-KR,ko;q=0.9' "$u" -o toss.html || true
            echo "bytes=$(wc -c < toss.html 2>/dev/null || echo 0)"
            echo '--- MARKET CONTEXT ---'
            grep -aoE '.{0,180}(코스피|코스닥|나스닥|KOSPI|KOSDAQ|NASDAQ).{0,850}' toss.html 2>/dev/null | head -n 120 || true
            echo '--- API/ENDPOINT CANDIDATES ---'
            grep -aoE 'https?[^"<> ]+|/api/[^"<> ]+' toss.html 2>/dev/null | grep -Ei 'api|market|index|price|quote|ticker|stock' | head -n 150 || true
          done
