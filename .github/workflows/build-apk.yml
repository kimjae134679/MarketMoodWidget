name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MarketMoodWidget_v1.1_source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q MarketMoodWidget_v1.1_source.zip -d build-src
          test -f build-src/MarketMoodWidget/settings.gradle

      - name: Build debug APK
        working-directory: build-src/MarketMoodWidget
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Copy APK
        run: |
          mkdir -p out
          cp build-src/MarketMoodWidget/app/build/outputs/apk/debug/app-debug.apk out/MarketMoodWidget-v1.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketMoodWidget-v1.1-debug-apk
          path: out/MarketMoodWidget-v1.1-debug.apk
          if-no-files-found: error
          retention-days: 30
